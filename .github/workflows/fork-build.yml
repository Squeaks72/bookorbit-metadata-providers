name: Fork build

# Builds the MangaBaka provider this fork runs on Unraid and publishes it to
# ghcr.io/squeaks72/mangabaka-provider.
#
# Upstream's publish.yml builds any provider on a release tag, for two architectures. This box
# needs one image, linux/amd64, of one provider, rebuilt whenever `tim` changes -- so this is much
# smaller, and upstream's publish.yml is kept disabled.
#
# `:latest` is what the Unraid container tracks. Every build also gets an immutable
# `<version>-<sha>` tag, which is what to pin the container to if a build turns out bad.

on:
  push:
    branches: [tim]
    paths:
      - 'providers/mangabaka/**'
      - '.github/workflows/fork-build.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/squeaks72/mangabaka-provider

jobs:
  build:
    name: mangabaka / linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          # VERSION in main.rs is what /provider/info reports, and what BookOrbit keys its cache on.
          version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";/\1/p' providers/mangabaka/src/main.rs)
          test -n "$version"
          sha=$(git rev-parse --short HEAD)
          echo "immutable=${version}-${sha}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Building::${IMAGE}:latest and :${version}-${sha}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: providers/mangabaka
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.immutable }}
